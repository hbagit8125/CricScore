name: cric_score
description: Cricket scoring for every format, built on the Laws of Cricket.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.9.0

workspace:
  - packages/cricket_engine

dependencies:
  flutter:
    sdk: flutter
  cricket_engine:
    path: packages/cricket_engine
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  # Firebase stays on the 4.x line (iOS SDK 12) until the Google Sign-In
  # iOS plugin moves to GoogleSignIn-iOS 10: SDK 13 needs a newer
  # gtm-session-fetcher than GoogleSignIn-iOS 9 accepts, and the iOS build
  # cannot resolve both.
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.16.1
flutter:
  uses-material-design: true
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
